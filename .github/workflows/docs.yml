# Builds the docs site from docs/ with mkdocs, the amie book (docs/learn.md) at learn/ included, and publishes it
# with GitHub Pages at https://samging.github.io/amieCli/
name: Docs site

on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "scripts/mkdocs_hooks.py", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material==9.7.7
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
