site_name: Amie desktop app
site_description: How to use the Amie desktop app and the amie command line - the sandbox, scripting, packages, models and metrics
site_url: https://samging.github.io/amieCli/
repo_url: https://github.com/samging/amieCli
repo_name: samging/amieCli
docs_dir: docs
site_dir: build/docs-site
use_directory_urls: true

# Accounts, Keycloak and the Amie backend aren't part of amie yet: their pages stay in the repository, off the site
exclude_docs: |
  sign-in.md
  authentication.md
  backend-integration.md

# A link to a file of the repository outside docs/ points at it on GitHub
hooks:
  - scripts/mkdocs_hooks.py

theme:
  name: material
  palette:
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Light mode
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Dark mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Start here:
      - Overview: index.md
      - How the app works: architecture.md
      - The components: components.md
      - Set up a new Mac: setup-tutorial.md
      - Getting started: getting-started.md
  - The amie command line:
      - Learn amie: learn.md
      - amie reference: amie-reference.md
  - Working in the app:
      - The sandbox: sandbox.md
      - Running sessions: sessions.md
      - Scripting API: sandbox-scripting.md
      - Cookbook, scripts to copy: cookbook.md
      - Models and metrics: models.md
      - Serving a model: serving.md
      - Devices: devices.md
  - Reference:
      - The AMP folder: amp-folder.md
      # Accounts, Keycloak and the Amie backend aren't part of amie yet (AMIE_ACCOUNTS=1 turns them on)
      # - Signing in: sign-in.md
      # - Keycloak setup: authentication.md
      # - Amie backend: backend-integration.md
      - Models page: models-page.md
      - Settings: settings.md
      - Troubleshooting: troubleshooting.md
      - Raspberry Pi 5: pi5.md
      - Where the code is: source-layout.md
      - The code of amie, what is where and why: codebase.md
